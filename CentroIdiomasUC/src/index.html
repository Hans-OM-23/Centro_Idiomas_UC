<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Centro de Idiomas | Universidad Continental</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Estilos base: Fondo con transparencia de color y tipografía sobria y minimalista -->
  <style>
    :root {
      --uc-brand: #a81c24;
      --uc-brand-dark: #7a1218;
      --uc-navy: #0f172a;
      --uc-slate: #334155;
    }

    /* Fondo con transparencia de color sutil sobre gradiente refinado */
    html {
      background-color: #e8ecf2;
    }

    body {
      background-color: rgba(244, 247, 251, 0.92);
      background-image: 
        radial-gradient(at 0% 0%, rgba(168, 28, 36, 0.05) 0px, transparent 45%),
        radial-gradient(at 100% 0%, rgba(15, 23, 42, 0.06) 0px, transparent 45%),
        radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.04) 0px, transparent 55%);
      background-attachment: fixed;
      color: #1e293b;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body style="background-color: rgba(244, 247, 251, 0.92);">
  <app-root></app-root>
  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

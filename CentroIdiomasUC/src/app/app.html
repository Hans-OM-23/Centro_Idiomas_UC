  <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
    <div class="d-flex align-items-center gap-3">
      <div class="rounded-3 bg-danger text-white d-flex align-items-center justify-content-center fw-bold shadow-sm" style="width: 44px; height: 44px; font-size: 1.25rem;">
        UC
      </div>
      <div>
        <h1 class="h5 fw-bold mb-0 text-dark">Centro de Idiomas</h1>
        <small class="text-secondary">Universidad Continental • Excelencia y Proyección Global</small>

<!-- Contenido Principal Estructurado por Componentes -->

  <!-- 3. Presentación de Docentes -->
  <app-presentacion-docentes></app-presentacion-docentes>

</main>
